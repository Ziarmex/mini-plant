# Configuration Mosquitto avec TLS
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Listener MQTTS (Port 8883)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username false

# TLS version et ciphers
tls_version tlsv1.2

# Listener interne (non-TLS) pour les services Docker (Node-RED)
listener 1883
protocol mqtt

# Listener WebSocket sécurisé (désactivé car port 9001 utilisé)
# listener 9001
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

# Authentification via certificats TLS (require_certificate = true)
allow_anonymous true

# Options de sécurité
max_connections -1
max_inflight_messages 20
max_queued_messages 1000